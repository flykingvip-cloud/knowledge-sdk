[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "knowledge-sdk"
version = "1.2.0"
description = "Framework-independent, permission-aware, versioned knowledge library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
[project.optional-dependencies]
mcp = ["mcp>=1.30,<2; python_version >= '3.10'"]
http = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
qdrant = []
parsers = ["pypdf>=4,<6"]
ocr = []
dev = ["httpx>=0.27,<1", "build>=1,<2"]
[project.scripts]
knowledge-sdk-server = "knowledge_sdk.server.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knowledge_sdk.ui" = ["static/*.html", "static/*.css", "static/*.js"]
