{
  "name": "${SANDBOX_PROJECT:?prepare first}",
  "services": {
    "seed": {
      "image": "${SANDBOX_IMAGE:?prepare first}",
      "user": "${SANDBOX_UID:?}:${SANDBOX_GID:?}",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "512m",
      "cpus": 2,
      "pids_limit": 128,
      "volumes": [
        "${SANDBOX_STATE:?}/data:/data",
        "${SANDBOX_STATE:?}/secrets/hmac:/run/secrets/knowledge_auth_secret:ro",
        "./:/opt/sandbox:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=32m"
      ],
      "environment": {
        "SANDBOX_MODE": "postgres",
        "KNOWLEDGE_SDK_DSN": "host=fixture-postgres port=5432 dbname=openbot_fixture user=fixture_runtime options=-csearch_path=fixture_sdk,public"
      },
      "entrypoint": [
        "python",
        "/opt/sandbox/seed_openbot_sandbox.py",
        "--state-dir",
        "/data",
        "--mode",
        "postgres"
      ],
      "restart": "no",
      "depends_on": {
        "fixture-postgres": {
          "condition": "service_healthy"
        }
      }
    },
    "sandbox": {
      "image": "${SANDBOX_IMAGE:?prepare first}",
      "user": "${SANDBOX_UID:?}:${SANDBOX_GID:?}",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "512m",
      "cpus": 2,
      "pids_limit": 128,
      "volumes": [
        "${SANDBOX_STATE:?}/data:/data",
        "${SANDBOX_STATE:?}/secrets/hmac:/run/secrets/knowledge_auth_secret:ro",
        "./:/opt/sandbox:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=32m"
      ],
      "environment": {
        "SANDBOX_MODE": "postgres",
        "KNOWLEDGE_SDK_DSN": "host=fixture-postgres port=5432 dbname=openbot_fixture user=fixture_runtime options=-csearch_path=fixture_sdk,public"
      },
      "entrypoint": [
        "python",
        "/opt/sandbox/serve_sandbox.py"
      ],
      "ports": [
        "127.0.0.1:${SANDBOX_PORT:?}:8088"
      ],
      "depends_on": {
        "seed": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "fixture-postgres": {
      "image": "${SANDBOX_PG_IMAGE:-pgvector/pgvector:pg17}",
      "environment": {
        "POSTGRES_DB": "openbot_fixture",
        "POSTGRES_HOST_AUTH_METHOD": "trust"
      },
      "volumes": [
        "./init-fixture-postgres.sql:/docker-entrypoint-initdb.d/fixture.sql:ro"
      ],
      "tmpfs": [
        "/var/lib/postgresql/data:rw,size=768m"
      ],
      "mem_limit": "1g",
      "cpus": 2,
      "pids_limit": 128,
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "psql -h 127.0.0.1 -U fixture_runtime -d openbot_fixture -v ON_ERROR_STOP=1 -c \"SELECT 'fixture_sdk'::regnamespace\" >/dev/null"
        ],
        "interval": "2s",
        "timeout": "2s",
        "retries": 30
      }
    }
  },
  "networks": {
    "default": {
      "internal": true,
      "labels": {
        "knowledge-sdk-fixture": "SDK22_ALIGN_WAVE1P5"
      }
    }
  }
}
