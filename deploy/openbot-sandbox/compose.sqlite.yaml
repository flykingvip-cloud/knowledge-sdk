{
  "services": {
    "seed": {
      "image": "${SANDBOX_IMAGE:?prepare first}",
      "user": "${SANDBOX_UID:?}:${SANDBOX_GID:?}",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "512m",
      "cpus": 2,
      "pids_limit": 128,
      "volumes": [
        "${SANDBOX_STATE:?}/data:/data",
        "${SANDBOX_STATE:?}/secrets/hmac:/run/secrets/knowledge_auth_secret:ro",
        "./:/opt/sandbox:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=32m"
      ],
      "environment": {
        "SANDBOX_MODE": "sqlite"
      },
      "entrypoint": [
        "python",
        "/opt/sandbox/seed_openbot_sandbox.py",
        "--state-dir",
        "/data",
        "--mode",
        "sqlite"
      ],
      "restart": "no"
    },
    "sandbox": {
      "image": "${SANDBOX_IMAGE:?prepare first}",
      "user": "${SANDBOX_UID:?}:${SANDBOX_GID:?}",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "512m",
      "cpus": 2,
      "pids_limit": 128,
      "volumes": [
        "${SANDBOX_STATE:?}/data:/data",
        "${SANDBOX_STATE:?}/secrets/hmac:/run/secrets/knowledge_auth_secret:ro",
        "./:/opt/sandbox:ro"
      ],
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=32m"
      ],
      "environment": {
        "SANDBOX_MODE": "sqlite"
      },
      "entrypoint": [
        "python",
        "/opt/sandbox/serve_sandbox.py"
      ],
      "ports": [
        "127.0.0.1:${SANDBOX_PORT:?}:8088"
      ],
      "depends_on": {
        "seed": {
          "condition": "service_completed_successfully"
        }
      }
    }
  },
  "networks": {
    "default": {
      "internal": true,
      "labels": {
        "knowledge-sdk-fixture": "SDK22_ALIGN_WAVE1P5"
      }
    }
  }
}
