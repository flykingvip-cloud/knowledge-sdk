    - run: python -m pip install -e '.[http,dev,mcp,postgres,oidc,parsers]' pytest
    - name: Provision isolated non-superuser pgvector test role
      env:
        TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
      run: "python - <<'PYCODE'\nimport os, psycopg\nfrom pathlib import Path\ndsn='host=127.0.0.1 port='+os.environ['TEST_PG_PORT']+'\
        \ dbname=sdk_align user=postgres'\nwith open(os.environ['GITHUB_ENV'],'a') as file:\n    file.write('KNOWLEDGE_SDK_TEST_PG_DSN='+dsn.replace('user=postgres','user=sdk_align')+'\\\
        n')\nwith psycopg.connect(dsn,autocommit=True) as c:\n    c.execute('CREATE EXTENSION IF NOT EXISTS vector')\n   \
        \ c.execute('CREATE ROLE sdk_align LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE')\n    c.execute('GRANT CREATE\
        \ ON DATABASE sdk_align TO sdk_align')\n    c.execute('CREATE DATABASE openbot_fixture')\nfixture_dsn=dsn.replace('dbname=sdk_align','dbname=openbot_fixture')\n\
        with psycopg.connect(fixture_dsn,autocommit=True) as c:\n    c.execute(Path('deploy/openbot-sandbox/init-fixture-postgres.sql').read_text())\n\
        with open(os.environ['GITHUB_ENV'],'a') as file:\n    file.write('KNOWLEDGE_SDK_SANDBOX_TEST_DSN='+fixture_dsn.replace('user=postgres','user=fixture_runtime')+'\
        \ options=-csearch_path=fixture_sdk,public\\n')\nPYCODE\n"
    - run: python -W error::ResourceWarning -m pytest -q
