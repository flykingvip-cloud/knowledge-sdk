name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -S -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - run: PYTHONPATH=src python -S -W error::ResourceWarning -m tests.benchmark.run
  http-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[http,dev,mcp]'
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - run: python -m build
