name: tests
on: [push, pull_request]
env:
  PYTHONPATH: src
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-22.04
          - python: '3.12'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -S -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - run: PYTHONPATH=src python -S -W error::ResourceWarning -m tests.benchmark.runner --json
  http-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-22.04
          - python: '3.12'
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[http,dev,mcp]'
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - run: python -m build
