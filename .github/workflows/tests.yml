  pre-v7-space-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      prototype_control:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sdk25_control_fixture
        ports:
          - 127.0.0.1::5432
        options: --health-cmd "pg_isready -U postgres -d sdk25_control_fixture" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Development-only prototype validators
        run: python -m pip install 'psycopg[binary]' 'openapi-spec-validator==0.9.0'
      - name: Mark only this newly provisioned control service
        env:
          SDK25_CONTROL_PORT: ${{ job.services.prototype_control.ports[5432] }}
        run: |
          python - <<'PYCODE'
          import os,psycopg
          dsn='host=127.0.0.1 port='+os.environ['SDK25_CONTROL_PORT']+' dbname=sdk25_control_fixture user=postgres'
          with psycopg.connect(dsn,autocommit=True) as c:
              assert c.execute('SELECT current_database()').fetchone()[0]=='sdk25_control_fixture'
              c.execute("COMMENT ON DATABASE sdk25_control_fixture IS 'SDK25_OWNED_EPHEMERAL_CONTROL_V1'")
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SDK25_PROVISION_DSN='+dsn+'\nSDK25_REQUIRE_PG=1\n')
          PYCODE
      - name: Exact accepted runtime and historical byte guard
        run: |
          mkdir -p sdk25-ci-evidence
          python docs/acceptance/pre-v7-space-alignment/verify_boundaries.py | tee sdk25-ci-evidence/boundaries.json
      - name: Actual SQLite and non-superuser owner FORCE-RLS prototype tests
        run: python -W error::ResourceWarning -m unittest discover -s sandbox/space_alignment_v1 -v 2>&1 | tee sdk25-ci-evidence/prototype-tests.log
      - name: Candidate Python vectors and maintained OpenAPI31 validation
        run: |
          python -W error::ResourceWarning contracts/space-alignment-v1/validate.py | tee sdk25-ci-evidence/python-vectors.json
          python -W error::ResourceWarning -m openapi_spec_validator --schema 3.1 contracts/space-alignment-v1/openapi.json | tee sdk25-ci-evidence/openapi-validation.log
      - name: Strict candidate TS compile and actual Node vectors
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix contracts/space-alignment-v1
          contracts/space-alignment-v1/node_modules/.bin/tsc -p contracts/space-alignment-v1/tsconfig.json
          node contracts/space-alignment-v1/ts-generated/check.js contracts/space-alignment-v1/openapi.json contracts/space-alignment-v1/fixtures.json | tee sdk25-ci-evidence/ts-vectors.json
      - name: Synthetic file-only dry-run report
        run: |
          python - <<'PYCODE'
          import subprocess,sys
          from pathlib import Path
          result=subprocess.run([sys.executable,'-W','error::ResourceWarning','sandbox/space_alignment_v1/dry_run.py','sandbox/space_alignment_v1/synthetic-pre03.json','--output','sdk25-ci-evidence/dry-run.json'],capture_output=True,text=True)
          assert result.returncode==2
          Path('sdk25-ci-evidence/dry-run-cli.log').write_text(result.stdout+result.stderr)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk25-design-prototype-evidence
          path: sdk25-ci-evidence/
