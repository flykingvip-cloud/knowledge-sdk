name: q2-m4-l4-headless
on:
  push:
    branches: [feat/q2-phase4-oidc-scim-connectors]
    paths:
      - .github/workflows/q2-m4-l4.yml
      - docs/acceptance/v2.0-q2-phase4/l4_ci_runner.py
permissions:
  contents: read
concurrency:
  group: q2-m4-l4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55474:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src:.
      KNOWLEDGE_SDK_TEST_PG_DSN: host=127.0.0.1 port=55474 user=sdk_m4 dbname=sdk_m4
      L4_OUTPUT: l4-ci-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional CI tools only
        run: |
          python -m pip install -e '.[http,oidc,postgres,dev]' playwright==1.56.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y nginx postgresql-client
          sudo systemctl stop nginx
      - name: Initialize isolated non-superuser pgvector database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '55474'
          PGUSER: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE ROLE sdk_m4 LOGIN NOSUPERUSER NOBYPASSRLS'
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE sdk_m4 OWNER sdk_m4'
          psql -v ON_ERROR_STOP=1 -d sdk_m4 -c 'CREATE EXTENSION vector'
      - name: Relevant enterprise regressions
        run: |
          mkdir -p l4-ci-evidence
          python -W error::ResourceWarning -m unittest tests.q2.test_q2_m4_enterprise tests.server.test_q2_m4_http -v > l4-ci-evidence/enterprise-regressions.log 2>&1
      - name: Real independent Chromium headless dual-engine browser acceptance
        run: python docs/acceptance/v2.0-q2-phase4/l4_ci_runner.py
      - name: Retain sanitized acceptance artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-m4-l4-${{ github.sha }}-${{ github.run_attempt }}
          path: l4-ci-evidence/
          retention-days: 7
          if-no-files-found: error
