  "components": {
    "parameters": {
      "RequestId": {
        "name": "X-Request-Id",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1
        },
        "description": "Trusted verified gateway correlation/mapping only; never accepts arbitrary client identity or tenant authority."
      },
      "TenantId": {
        "name": "X-Tenant-Id",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 1
        },
        "description": "Trusted verified gateway correlation/mapping only; never accepts arbitrary client identity or tenant authority."
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string",
          "minLength": 1,
          "maxLength": 256
        },
        "description": "DRAFT future v2 only. Optional retry identity scoped to trusted (tenant_id, endpoint, idempotency_key), checked against the payload digest and current actor authority. A key reused for different content returns 409 IDEMPOTENCY_CONFLICT; no v1/runtime implementation."
      }
    },
    "securitySchemes": {
      "TrustedGateway": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Verified OIDC JWT or trusted gateway token bound to signed context"
      }
    },
    "schemas": {
      "JsonValue": {
        "anyOf": [
          {
            "type": "null"
          },
          {
            "type": "boolean"
          },
          {
            "type": "number"
          },
          {
            "type": "string"
          },
          {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/JsonValue"
            }
          },
          {
            "type": "object",
            "additionalProperties": {
              "$ref": "#/components/schemas/JsonValue"
            }
          }
        ]
      },
      "ErrorCode": {
        "type": "string",
        "enum": [
          "VALIDATION_ERROR",
          "UNAUTHENTICATED",
          "SIGNATURE_INVALID",
          "REPLAY_DETECTED",
          "PERMISSION_DENIED",
          "IDENTITY_REVOKED",
          "POLICY_GENERATION_STALE",
          "REDACTION_FAIL_CLOSED",
          "RESOURCE_NOT_FOUND",
          "CONFLICT",
          "IDEMPOTENCY_CONFLICT",
          "LIFECYCLE_CONFLICT",
          "TAMPERED_EXCERPT",
          "ANCHOR_UNRESOLVABLE",
          "RATE_LIMITED",
          "CONTEXT_BUDGET_EXCEEDED",
          "BACKEND_UNAVAILABLE"
        ]
      },
      "CanonicalKbUri": {
        "type": "string",
        "pattern": "^kb://org/[^/]+/doc/[^@]+@[1-9][0-9]*(#(anchor|chunk)=.+)?$"
      },
      "LegacyKuUri": {
        "type": "string",
        "pattern": "^ku://kb/[^/]+/doc/[^@]+@[^#]+(#.*)?$"
      },
      "IdentityContext": {
        "type": "object",
        "properties": {
          "request_id": {
            "type": "string",
            "maxLength": 32000
          },
          "tenant_id": {
            "type": "string",
            "maxLength": 32000
          },
          "actor": {
            "type": "object",
            "properties": {
              "issuer": {
                "type": "string",
                "maxLength": 32000
              },
              "subject_id": {
                "type": "string",
                "maxLength": 32000
              },
              "actor_type": {
                "type": "string",
                "enum": [
                  "human",
                  "agent",
                  "service"
                ]
              },
              "roles": {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 32000
                },
                "maxItems": 1000
              },
              "department_ids": {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 32000
                },
                "maxItems": 1000
              },
              "ancestor_department_ids": {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 32000
                },
                "maxItems": 1000
              },
              "org_roles": {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 32000
                },
                "maxItems": 1000
              },
              "clearance_level": {
                "type": "string",
                "maxLength": 32000
              },
              "clearance_tags": {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 32000
                },
                "maxItems": 1000
              },
              "policy_generation": {
                "$ref": "#/components/schemas/PolicyGeneration"
              },
              "session_id": {
                "type": "string",
                "maxLength": 32000
              }
            },
            "required": [
              "issuer",
              "subject_id",
              "actor_type",
              "roles",
              "department_ids",
              "ancestor_department_ids",
              "org_roles",
              "clearance_level",
              "clearance_tags",
              "policy_generation",
              "session_id"
            ],
            "additionalProperties": false
          },
          "agent": {
            "type": "object",
            "properties": {
              "agent_id": {
                "type": "string",
                "maxLength": 32000
              },
              "profile_generation": {
                "type": "integer",
                "minimum": 1
              },
              "task_id": {
                "type": "string",
                "maxLength": 32000
              }
            },
            "required": [
              "agent_id",
              "profile_generation",
              "task_id"
            ],
            "additionalProperties": false
          },
          "purpose": {
            "type": "string",
            "enum": [
              "read",
              "ground_internal_llm",
              "ground_external_llm",
              "export",
              "eval_and_train"
            ]
          }
        },
        "required": [
          "request_id",
          "tenant_id",
          "actor",
          "purpose"
        ],
        "additionalProperties": false
      },
      "KnowledgeBase": {
        "type": "object",
        "properties": {
          "kb_id": {
            "type": "string",
            "maxLength": 32000
